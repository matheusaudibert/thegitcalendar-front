name: Update commit preview image

# Regenerates public/commit-preview.png from the contribution-graph API and
# commits it to the repo. The hero mockup then serves it as a static asset
# instead of hitting the API on every page load, which used to show up as a
# visible delay before the wallpaper appeared.
#
# Keep this in sync with lib/showcase-users.ts (SHOWCASE_USER / WIDTH / HEIGHT).

on:
  schedule:
    - cron: "0 9 * * *" # daily at 06:00 America/Sao_Paulo (UTC-3, no DST) = 09:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download commit preview image
        env:
          USERNAME: matheusaudibert
          WIDTH: "1290"
          HEIGHT: "2796"
        run: |
          set -euo pipefail
          url="https://gitcalendar-image.vercel.app/graph?username=${USERNAME}&background=github&color=green&shape=rounded&width=${WIDTH}&height=${HEIGHT}"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 5 \
            --output public/commit-preview.png \
            "$url"
          file public/commit-preview.png | grep -qi 'PNG image data'

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- public/commit-preview.png; then
            echo "No changes to public/commit-preview.png"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/commit-preview.png
          git commit -m "chore: update commit preview image"
          git push
